# =====================
# Database Configuration (SQL Server)
# =====================
spring.datasource.url=jdbc:mysql://localhost:3306/english_learning_flashcard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# spring.datasource.password=root
spring.datasource.password=Manh1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# Thymeleaf
# =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =====================
# App Settings
# =====================
server.port=8081

# Hard-coded user id cho demo (bỏ qua login)
# app.demo.user-id=1

# =====================
# Request / Response Logging
# =====================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
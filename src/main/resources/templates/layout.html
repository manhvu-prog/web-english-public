<!-- Layout chung của ứng dụng, định nghĩa cấu trúc Header và Main Content -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">AnkarD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .nav-link {
            @apply text-sm font-bold text-gray-500 hover:text-blue-600 transition-colors uppercase tracking-widest;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col antialiased text-gray-900">

    <!-- Nhúng Header dùng chung -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Khu vực hiển thị thông báo nhanh (Floating Notifications) -->
    <div class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] w-full max-w-xl px-4 pointer-events-none">
        <div th:if="${success}"
            class="pointer-events-auto p-4 bg-green-600 text-white rounded-2xl shadow-2xl flex items-center justify-center gap-3 animate-bounce">
            <span class="text-sm font-bold tracking-wide" th:text="${success}">Thành công!</span>
        </div>
        <div th:if="${error}"
            class="pointer-events-auto p-4 bg-red-600 text-white rounded-2xl shadow-2xl flex items-center justify-center gap-3 animate-pulse">
            <span class="text-sm font-bold tracking-wide" th:text="${error}">Lỗi!</span>
        </div>
    </div>

    <!-- Nội dung thay đổi tùy theo từng trang -->
    <main class="flex-grow w-full">
        <th:block th:replace="${content}"></th:block>
    </main>



    <script th:src="@{/js/main.js}"></script>
</body>

</html>

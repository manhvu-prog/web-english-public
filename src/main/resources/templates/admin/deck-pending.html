<!-- Trang Quản trị: Duyệt các bộ thẻ cộng đồng đang chờ xử lý -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Duyệt Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-6xl mx-auto py-10 px-4 sm:px-6 lg:px-8">

        <div th:if="${success}"
            class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm rounded shadow-sm">
            <span th:text="${success}">Thành công!</span>
        </div>
        <div th:if="${error}"
            class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded shadow-sm">
            <span th:text="${error}">Lỗi!</span>
        </div>

        <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Danh sách deck chờ duyệt</h2>
            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase"
                th:text="${#lists.size(pendingDecks)} + ' chờ duyệt'">0 chờ duyệt</span>
        </div>

        <!-- Bảng danh sách các bộ thẻ đang chờ được phê duyệt -->

        <div th:if="${#lists.isEmpty(pendingDecks)}"
            class="bg-white rounded-lg border border-dashed border-gray-300 py-20 text-center">
            <p class="text-gray-500">Không có deck nào đang chờ duyệt.</p>
        </div>

        <div th:unless="${#lists.isEmpty(pendingDecks)}"
            class="bg-white shadow-sm border border-gray-200 rounded-xl overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Thông tin Deck</th>
                        <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Người tạo</th>
                        <th class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Hành động</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="deck : ${pendingDecks}" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${deck.deckId}">1</td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-semibold text-gray-900" th:text="${deck.title}">Title</div>
                            <div class="text-xs text-gray-500 truncate max-w-xs"
                                th:text="${deck.description != null ? deck.description : 'Không có mô tả'}">Description
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span
                                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-800"
                                th:text="${deck.createdBy != null ? deck.createdBy.username : 'Ẩn danh'}">
                                username
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                            <a th:href="@{/admin/decks/{id}/view(id=${deck.deckId})}"
                                class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50 transition shadow-sm">
                                Xem
                            </a>

                            <form th:action="@{/admin/decks/{id}/approve(id=${deck.deckId})}" method="post"
                                class="inline">
                                <button type="submit"
                                    class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-sm">
                                    Approve
                                </button>
                            </form>

                            <form th:action="@{/admin/decks/{id}/approve-as-vip(id=${deck.deckId})}" method="post"
                                class="inline" onsubmit="return confirm('Duyệt và đánh dấu deck này là VIP Only?');">
                                <button type="submit"
                                    class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-bold rounded text-white transition shadow-sm"
                                    style="background:linear-gradient(135deg,#f59e0b,#d97706);">
                                    👑 VIP
                                </button>
                            </form>

                            <form th:action="@{/admin/decks/{id}/reject(id=${deck.deckId})}" method="post"
                                class="inline">
                                <button type="submit"
                                    class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded text-white bg-red-500 hover:bg-red-600 transition shadow-sm">
                                    Reject
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>

</html>

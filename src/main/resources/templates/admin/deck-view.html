<!-- Trang Quản trị: Xem chi tiết nội dung của một bộ thẻ trước khi duyệt -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Xem Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex space-x-6 text-sm font-medium">
                    <a th:href="@{/admin/decks/pending}" class="text-gray-500 hover:text-indigo-600 transition-colors">← Quay lại duyệt deck</a>
                </div>
                <div class="text-xs uppercase tracking-widest font-semibold text-gray-400">Admin Panel</div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">

        <!-- Thông tin deck -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 mb-8">
            <div class="flex items-start justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900" th:text="${deck.title}">Tiêu đề deck</h2>
                    <p class="mt-1 text-sm text-gray-500"
                        th:text="${deck.description != null ? deck.description : 'Không có mô tả'}">Mô tả</p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-800"
                        th:text="${deck.createdBy != null ? deck.createdBy.username : 'Ẩn danh'}">
                        username
                    </span>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-50 text-yellow-700">
                        Chỉ xem
                    </span>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-100">
                <span class="text-xs text-gray-400">
                    Tổng số từ:
                    <span class="font-semibold text-gray-600" th:text="${#lists.size(flashcards)}">0</span>
                </span>
            </div>
        </div>

        <!-- Danh sách flashcard -->
        <div th:if="${#lists.isEmpty(flashcards)}"
            class="bg-white rounded-xl border border-dashed border-gray-300 py-20 text-center">
            <p class="text-gray-500">Deck này chưa có từ nào.</p>
        </div>

        <div th:unless="${#lists.isEmpty(flashcards)}" class="space-y-3">
            <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Danh sách từ</h3>

            <div th:each="card, iterStat : ${flashcards}"
                class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="flex items-stretch">
                    <!-- STT -->
                    <div class="flex items-center justify-center w-12 bg-indigo-50 text-indigo-500 font-semibold text-sm shrink-0"
                        th:text="${iterStat.count}">1</div>

                    <!-- Nội dung -->
                    <div class="flex flex-1 divide-x divide-gray-100">
                        <!-- Mặt trước -->
                        <div class="flex-1 px-5 py-4">
                            <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Mặt trước</div>
                            <div class="font-medium text-gray-900" th:text="${card.frontContent}">front</div>
                            <div th:if="${card.pronunciation != null and !#strings.isEmpty(card.pronunciation)}"
                                class="mt-1 text-xs text-indigo-500 italic" th:text="${card.pronunciation}">
                                /pronunciation/
                            </div>
                        </div>

                        <!-- Mặt sau -->
                        <div class="flex-1 px-5 py-4">
                            <div class="text-xs text-gray-400 uppercase tracking-wider mb-1">Mặt sau</div>
                            <div class="font-medium text-gray-900" th:text="${card.backContent}">back</div>
                            <div th:if="${card.exampleSentence != null and !#strings.isEmpty(card.exampleSentence)}"
                                class="mt-1 text-xs text-gray-400 italic" th:text="${card.exampleSentence}">
                                Ví dụ...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Nút quay lại -->
        <div class="mt-10 text-center">
            <a th:href="@{/admin/decks/pending}"
                class="inline-flex items-center px-5 py-2.5 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition shadow-sm">
                ← Quay lại danh sách chờ duyệt
            </a>
        </div>

    </main>

</body>

</html>

<!-- Trang Hiển thị Lỗi: Thông báo lỗi chung cho toàn bộ ứng dụng -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lỗi | AnkarD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Hiệu ứng rung nhẹ cho biểu tượng lỗi */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .error-icon {
            animation: shake 0.5s ease-in-out infinite alternate;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center px-4">

    <div class="max-w-md w-full text-center">

        <div class="mb-8 flex justify-center">
            <div
                class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center border-4 border-red-100 shadow-inner">
                <span class="text-5xl error-icon">⚠️</span>
            </div>
        </div>

        <div
            class="bg-white p-10 md:p-12 rounded-[3rem] shadow-[0_30px_70px_rgba(0,0,0,0.05)] border border-gray-50 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-24 h-24 bg-red-50/50 rounded-bl-full -mr-12 -mt-12"></div>

            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-4 uppercase italic">Đã xảy ra lỗi</h2>

            <div class="py-4 px-6 bg-gray-50 rounded-2xl border border-gray-100 mb-8">
                <p class="text-gray-600 text-sm italic font-medium leading-relaxed"
                    th:text="${errorMessage != null ? errorMessage : 'Lỗi không xác định hoặc phiên làm việc đã hết hạn. Vui lòng thử lại.'}">
                    Thông báo lỗi mặc định.
                </p>
            </div>

            <div class="flex flex-col gap-4">
                <a th:href="@{/}"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-8 rounded-2xl shadow-xl shadow-blue-100 transition-all active:scale-[0.95] tracking-widest text-sm uppercase">
                    Quay lại trang chủ
                </a>

                <button onclick="window.history.back()"
                    class="text-xs font-bold text-gray-400 hover:text-gray-900 transition uppercase tracking-[0.2em]">
                    Quay lại trang trước
                </button>
            </div>
        </div>


    </div>

</body>

</html>

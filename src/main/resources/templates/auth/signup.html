<!-- Trang Đăng ký (Signup Page) -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | AnkarD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-[500px]">

            <div th:if="${success}"
                class="mb-6 p-4 bg-green-50 text-green-700 rounded-2xl border border-green-100 text-sm text-center shadow-sm"
                th:text="${success}"></div>
            <div th:if="${error}"
                class="mb-6 p-4 bg-red-50 text-red-700 rounded-2xl border border-red-100 text-sm text-center shadow-sm"
                th:text="${error}"></div>

            <div
                class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.04)] border border-gray-50">

                <div class="text-center mb-10">
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Đăng ký tài khoản</h1>
                    <p class="text-gray-400 text-sm italic">Bắt đầu hành trình của bạn cùng AnkarD</p>
                </div>

                <!-- Form đăng ký liên kết với SignupFormDTO -->

                <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="flex flex-col gap-5">

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1">Tên đăng nhập</label>
                        <input type="text" th:field="*{username}" placeholder="Ví dụ: tung_duong"
                            class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-gray-50 focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition-all outline-none text-base" />
                        <p class="text-xs text-red-500 font-medium ml-1" th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}"></p>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1">Email liên hệ</label>
                        <input type="email" th:field="*{email}" placeholder="name@example.com"
                            class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-gray-50 focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition-all outline-none text-base" />
                        <p class="text-xs text-red-500 font-medium ml-1" th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}"></p>
                    </div>

                    <div class="flex flex-col gap-5">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-bold text-gray-700 ml-1">Mật khẩu</label>
                            <input type="password" th:field="*{password}" placeholder="••••••••"
                                class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-gray-50 focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition-all outline-none text-base" />
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-bold text-gray-700 ml-1">Xác nhận mật khẩu</label>
                            <input type="password" th:field="*{confirmPassword}" placeholder="••••••••"
                                class="w-full px-5 py-4 rounded-2xl border border-gray-200 bg-gray-50 focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition-all outline-none text-base" />
                        </div>

                        <div class="col-span-full"
                            th:if="${#fields.hasErrors('password') or #fields.hasErrors('confirmPassword')}">
                            <p class="text-xs text-red-500 font-medium ml-1" th:errors="*{password}"></p>
                            <p class="text-xs text-red-500 font-medium ml-1" th:errors="*{confirmPassword}"></p>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-blue-100 transition-all active:scale-[0.98] text-lg">
                            Đăng ký ngay
                        </button>
                    </div>
                </form>

                <div class="mt-10 text-center border-t border-gray-50 pt-6">
                    <p class="text-gray-500 text-sm font-medium">
                        Đã có tài khoản?
                        <a th:href="@{/login}"
                            class="text-blue-600 font-bold hover:text-blue-800 transition-colors ml-1">Đăng nhập</a>
                    </p>
                </div>
            </div>


        </div>
    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Giao diện Thanh điều hướng (Header Navigation) -->
    <nav th:fragment="header" class="bg-white border-b border-gray-100 px-6 py-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-10">
                <a th:href="@{/}" class="text-2xl font-black text-blue-600 tracking-tight italic">AnkarD</a>
                <div class="hidden lg:flex gap-6 items-center">
                    <a th:href="@{/public-decks}" class="nav-link">Cộng đồng</a>
                    <th:block th:if="${username != null}">
                        <a th:href="@{/decks/new}" class="nav-link text-blue-600">+ Tạo Deck</a>
                        <!-- Menu dành riêng cho Admin -->
                        <th:block
                            th:if="${role != null and (role.toLowerCase() == 'admin' or role.toLowerCase() == 'super_admin')}">
                            <a th:href="@{/admin/decks/pending}" class="nav-link text-orange-500">Duyệt bài</a>
                            <a th:href="@{/admin/decks/vip}" class="nav-link" style="color: #f59e0b;">&#x1F451; VIP Deck</a>
                            <a th:href="@{/admin/stats}" class="nav-link" style="color: #8b5cf6;">&#x1F4CA; Thống kê</a>
                            <a th:href="@{/admin/users}" class="nav-link text-red-500">Tài khoản</a>
                        </th:block>
                    </th:block>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <!-- Thông tin người dùng đã đăng nhập -->
                <div th:if="${username != null}" class="flex items-center gap-4">
                    <span class="hidden sm:block text-sm font-medium text-gray-400 italic">Xin chào, <span
                            class="text-gray-900 font-bold" th:text="${username}">User</span>
                        <span th:if="${isVip}" class="ml-1 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black"
                            style="background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a0533;">&#x1F451; VIP</span>
                    </span>
                    <a th:if="${!isVip and username != null}" th:href="@{/vip}"
                        class="hidden sm:block text-xs font-black uppercase tracking-widest transition px-3 py-1.5 rounded-full"
                        style="background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a0533;">
                        &#x1F451; Nâng VIP
                    </a>
                    <a th:href="@{/account}" class="p-2 hover:bg-gray-100 rounded-full transition"
                        title="Cài đặt tài khoản">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </a>
                    <form th:action="@{/logout}" method="post" class="inline border-0 m-0 p-0">
                        <button type="submit"
                            class="bg-transparent border-none p-0 outline-none shadow-none text-xs font-black text-red-400 hover:text-red-600 uppercase tracking-widest transition">Đăng xuất</button>
                    </form>
                </div>
                <!-- Nút đăng nhập cho khách -->
                <a th:if="${username == null}" th:href="@{/login}"
                    class="btn-primary px-6 py-2 bg-blue-600 text-white rounded-full font-bold text-sm shadow-lg shadow-blue-100 hover:bg-blue-700 transition">Đăng
                    nhập</a>
            </div>
        </div>
    </nav>
</body>
</html>

<!-- Trang Chỉnh sửa Flashcard cụ thể -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa Flashcard | AnkarD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Đồng bộ style ô nhập liệu với toàn bộ hệ thống */
        .form-input-main {
            @apply w-full px-5 py-4 rounded-2xl border border-gray-200 bg-gray-50 focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition-all outline-none text-base text-gray-900;
            border-width: 1px;
        }

        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg shadow-blue-100 transition-all active:scale-[0.98] text-lg;
        }

        .btn-secondary {
            @apply bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-4 px-8 rounded-2xl transition-all active:scale-[0.98] text-lg text-center;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-[600px]">

            <div
                class="bg-white p-10 md:p-14 rounded-[3rem] shadow-[0_30px_70px_rgba(0,0,0,0.04)] border border-gray-50">

                <header class="text-center mb-12">
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-3">Sửa Flashcard</h1>
                    <p class="text-gray-400 text-sm italic">Cập nhật thông tin chi tiết cho thẻ ghi nhớ của bạn.</p>
                </header>

                <form th:action="@{/decks/{deckId}/flashcards/{cardId}/edit(deckId=${deckId}, cardId=${flashcardId})}"
                    th:object="${flashcardForm}" method="post" class="flex flex-col gap-7">

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1 uppercase tracking-wider">Mặt trước *</label>
                        <input type="text" th:field="*{frontContent}" placeholder="Nhập câu hỏi hoặc từ vựng..."
                            class="form-input-main" />
                        <p th:if="${#fields.hasErrors('frontContent')}" th:errors="*{frontContent}"
                            class="text-xs text-red-500 font-bold mt-1 ml-1"></p>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1 uppercase tracking-wider">Mặt sau *</label>
                        <input type="text" th:field="*{backContent}" placeholder="Nhập giải nghĩa hoặc đáp án..."
                            class="form-input-main" />
                        <p th:if="${#fields.hasErrors('backContent')}" th:errors="*{backContent}"
                            class="text-xs text-red-500 font-bold mt-1 ml-1"></p>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1 uppercase tracking-wider">Phát âm</label>
                        <input type="text" th:field="*{pronunciation}" placeholder="Ví dụ: /ə-ˈbi-lə-tē/"
                            class="form-input-main" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-bold text-gray-700 ml-1 uppercase tracking-wider">Câu ví dụ</label>
                        <textarea th:field="*{exampleSentence}" rows="4"
                            placeholder="Viết một câu minh họa để ghi nhớ lâu hơn..."
                            class="form-input-main resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-black text-gray-400 ml-1 uppercase tracking-widest">URL Hình
                                ảnh</label>
                            <input type="text" th:field="*{imageUrl}" placeholder="https://image-link.com"
                                class="w-full px-5 py-3.5 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white outline-none text-xs text-gray-600" />
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-black text-gray-400 ml-1 uppercase tracking-widest">URL Âm
                                thanh</label>
                            <input type="text" th:field="*{audioUrl}" placeholder="https://audio-link.com"
                                class="w-full px-5 py-3.5 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white outline-none text-xs text-gray-600" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6">
                        <button type="submit" class="btn-primary order-1 md:order-2">Lưu thay đổi</button>
                        <a th:href="@{/decks/{id}(id=${deckId})}"
                            class="btn-secondary order-2 md:order-1 flex items-center justify-center">
                            Hủy bỏ
                        </a>
                    </div>
                </form>

            </div>


        </div>
    </main>

</body>

</html>
